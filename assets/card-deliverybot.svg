<svg xmlns="http://www.w3.org/2000/svg" width="580" height="220" viewBox="0 0 580 220" role="img" aria-label="DeliveryBot">
    <defs>
      <linearGradient id="pcard-bg-card-deliverybot" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0c1220"/>
        <stop offset="100%" stop-color="#111c30"/>
      </linearGradient>
    </defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
    <rect width="580" height="220" rx="12" fill="url(#pcard-bg-card-deliverybot)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
    <rect x="0" y="0" width="5" height="220" rx="2" fill="#f43f5e"/>

    <g transform="translate(25, 30)">
      <text x="0" y="0" class="font-mono" font-size="11" font-weight="700" fill="#f43f5e" letter-spacing="1">AUTOMATIZACIÓN CON IA & N8N</text>
      <text x="0" y="28" class="font-sans" font-size="20" font-weight="800" fill="#ffffff">DeliveryBot</text>
      <text x="0" y="60" class="font-sans" font-size="13" fill="#94a3b8">
        Bot de pedidos en Telegram orquestado con flujos de n8n, Google Sheets como base de datos dinámica y Google Ge
      </text>
      <text x="0" y="80" class="font-sans" font-size="13" fill="#94a3b8">
        mini AI para comprensión de lenguaje natural y soporte al cliente.
      </text>

      <!-- Stack Pill -->
      <g transform="translate(0, 110)">
        <rect width="530" height="28" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="12" y="18" class="font-mono" font-size="11" fill="#cbd5e1">n8n · Gemini AI · Telegram Bot API · Google Sheets</text>
      </g>

      <!-- View Link -->
      <text x="0" y="165" class="font-mono" font-size="11.5" font-weight="600" fill="#f43f5e">↗ Ver código en GitHub</text>
