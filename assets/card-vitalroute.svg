<svg xmlns="http://www.w3.org/2000/svg" width="580" height="220" viewBox="0 0 580 220" role="img" aria-label="Vital-Route">
    <defs>
      <linearGradient id="pcard-bg-card-vitalroute" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0c1220"/>
        <stop offset="100%" stop-color="#111c30"/>
      </linearGradient>
    </defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
    <rect width="580" height="220" rx="12" fill="url(#pcard-bg-card-vitalroute)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
    <rect x="0" y="0" width="5" height="220" rx="2" fill="#818cf8"/>

    <g transform="translate(25, 30)">
      <text x="0" y="0" class="font-mono" font-size="11" font-weight="700" fill="#818cf8" letter-spacing="1">GESTIÓN &amp; LOGÍSTICA DE RUTAS</text>
      <text x="0" y="28" class="font-sans" font-size="20" font-weight="800" fill="#ffffff">Vital-Route</text>
      <text x="0" y="60" class="font-sans" font-size="13" fill="#94a3b8">
        Plataforma backend estructurada en TypeScript con arquitectura limpia para el cálculo y optimización de despac
      </text>
      <text x="0" y="80" class="font-sans" font-size="13" fill="#94a3b8">
        hos, trazabilidad y endpoints REST desacoplados.
      </text>

      <!-- Stack Pill -->
      <g transform="translate(0, 110)">
