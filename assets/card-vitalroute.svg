        <text x="12" y="18" class="font-mono" font-size="11" fill="#cbd5e1">TypeScript · Node.js · APIs REST · Clean Architecture</text>
      </g>

      <!-- View Link -->
      <text x="0" y="165" class="font-mono" font-size="11.5" font-weight="600" fill="#818cf8">↗ Ver código en GitHub</text>
