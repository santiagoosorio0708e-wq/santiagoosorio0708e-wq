<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Daniel Santiago Osorio Garcés - Desarrollador Backend &amp; Full Stack</title>
  <desc id="banner-desc">Especializado en Java 21, Spring Boot, Docker, n8n e Inteligencia Artificial. Formado en Campuslands, Bucaramanga, Colombia.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="cyan-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glow-circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid-pattern)"/>

  <!-- Ambient Glows -->
  <circle cx="150" cy="100" r="180" fill="url(#glow-circle)"/>
  <circle cx="1050" cy="320" r="220" fill="url(#glow-circle)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>

  <!-- Window Header / Dots -->
  <circle cx="45" cy="40" r="6" fill="#ef4444"/>
  <circle cx="65" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="40" r="6" fill="#10b981"/>
  <text x="115" y="44" class="font-mono" font-size="12" fill="#64748b">daniel-osorio@workstation:~ (campuslands-2026)</text>

  <!-- Status Pill -->
  <g transform="translate(930, 26)">
    <rect width="220" height="28" rx="14" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <circle cx="20" cy="14" r="4" fill="#10b981"/>
    <text x="34" y="18" class="font-mono" font-size="11" font-weight="600" fill="#34d399">DISPONIBLE PARA RETOS</text>
  </g>

  <!-- Main Title -->
  <text x="70" y="130" class="font-mono" font-size="15" font-weight="600" fill="#38bdf8" letter-spacing="2">&lt;BACKEND &amp; AI DEVELOPER /&gt;</text>
  <text x="70" y="195" class="font-sans" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1">DANIEL SANTIAGO OSORIO GARCÉS</text>

  <!-- Subtitle -->
  <text x="70" y="240" class="font-sans" font-size="20" font-weight="500" fill="#cbd5e1">
    Técnico en Desarrollo de Software · Formado intensivamente en <tspan fill="#38bdf8" font-weight="700">Campuslands</tspan>
  </text>
  <text x="70" y="272" class="font-sans" font-size="16" fill="#94a3b8">
    Construyo APIs REST de alto rendimiento en Java 21, contenedores con Docker, workflows en n8n y agentes de Inteligencia Artificial.
  </text>

  <!-- Tech Badges Bar -->
  <g transform="translate(70, 315)">
    <!-- Java -->
    <g transform="translate(0, 0)">
      <rect width="115" height="34" rx="6" fill="rgba(237, 139, 0, 0.1)" stroke="rgba(237, 139, 0, 0.4)" stroke-width="1"/>
      <text x="57" y="22" class="font-mono" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="middle">☕ Java 21</text>
    </g>
    <!-- Spring Boot -->
    <g transform="translate(125, 0)">
      <rect width="145" height="34" rx="6" fill="rgba(109, 179, 63, 0.1)" stroke="rgba(109, 179, 63, 0.4)" stroke-width="1"/>
      <text x="72" y="22" class="font-mono" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">🌱 Spring Boot</text>
    </g>
    <!-- Docker -->
    <g transform="translate(280, 0)">
      <rect width="115" height="34" rx="6" fill="rgba(36, 150, 237, 0.1)" stroke="rgba(36, 150, 237, 0.4)" stroke-width="1"/>
      <text x="57" y="22" class="font-mono" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">🐳 Docker</text>
    </g>
    <!-- n8n Workflows -->
    <g transform="translate(405, 0)">
      <rect width="140" height="34" rx="6" fill="rgba(255, 101, 132, 0.1)" stroke="rgba(255, 101, 132, 0.4)" stroke-width="1"/>
      <text x="70" y="22" class="font-mono" font-size="12" font-weight="600" fill="#f43f5e" text-anchor="middle">⚡ n8n Workflows</text>
    </g>
    <!-- Gemini AI -->
    <g transform="translate(555, 0)">
      <rect width="145" height="34" rx="6" fill="rgba(66, 133, 244, 0.1)" stroke="rgba(66, 133, 244, 0.4)" stroke-width="1"/>
      <text x="72" y="22" class="font-mono" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="middle">✨ Gemini AI</text>
    </g>
    <!-- PostgreSQL -->
    <g transform="translate(710, 0)">
      <rect width="140" height="34" rx="6" fill="rgba(65, 105, 225, 0.1)" stroke="rgba(65, 105, 225, 0.4)" stroke-width="1"/>
      <text x="70" y="22" class="font-mono" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">🐘 PostgreSQL</text>
    </g>
    <!-- Location -->
    <g transform="translate(860, 0)">
      <rect width="195" height="34" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="97" y="22" class="font-mono" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">📍 Bucaramanga, CO</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#cyan-indigo)"/>
</svg>